<!DOCTYPE html><html>
<head>
	<meta charset="utf-8" />
	<link id="favicon" rel="shortcut icon" type="image/png" href="data:image/png;base64,....==" />
	<title>Edit</title>
	<style>
        :root {color-scheme: light dark;}
        * {box-sizing: border-box;}

  		html {
            font-family: sans-serif;
		}
		body {
			padding: 0;
			margin: 0;
			overflow: hidden;

			display: grid;
			grid-template:
			    "list upload   title    download" min-content
			    "list content  content  content " 1fr
				"list username username save    " min-content
				"list message  message  save    " min-content
				/ 50vw 10vw 30vw 10vw;
			width: 100vw;
			height: 100vh;
		}

		#file_list {
			grid-area: list;
			overflow-y: scroll;
		}
		#button_upload {
			grid-area: upload;
		}
		#button_download {
			grid-area: download;
		}
		#button_save {
			grid-area: save;
		}
		#file_title {
			grid-area: title;
			text-align: center;
		}
		#file_content {
			grid-area: content;
		}
		#username {
			grid-area: username;
		}
		#message {
			grid-area: message;
		}
		#button_save {
			grid-area: save;
		}
	</style>
</head>
<body>
    <div id="file_list">Loading ...</div>
    <input type="file" id="input_upload" hidden />
    <button id="button_upload">Load from File</button>
    <h2 id="file_title">No file selected</h2>
    <button id="button_download">Download as File</button>
    <textarea id="file_content"></textarea>
    <input type="text" id="username" placeholder="Username (optional)" />
    <input type="text" id="message" placeholder="Change description (optional)" />
    <button id="button_save">Save</button>

<script type="module">

const hasIterationProtocol = variable => variable !== null && Symbol.iterator in Object(variable)
function h(type, params, children) {
    const el = document.createElement(type)
    for (let [k,v] of Object.entries(params)) {el.setAttribute(k,v)}
    if      (["string","number"].indexOf(typeof(children))>=0) {el.appendChild(document.createTextNode(children))}
    else if (hasIterationProtocol(children)) {for (let c of children) {el.append(c)}}
    else if (children                      ) {el.appendChild(children)}
    return el
}

const $file_list = document.getElementById('file_list')
const $file_title = document.getElementById('file_title')
const $file_content = document.getElementById('file_content')
const $button_save = document.getElementById('button_save')
const $input_upload = document.getElementById('input_upload')
const $button_upload = document.getElementById('button_upload')
const $button_download = document.getElementById('button_download')
const $username = document.getElementById('username')
const $message = document.getElementById('message')

function getFileContents(event) {
	const file = event.target.dataset.file
	console.debug(file)
	$button_save.dataset.file = file
	$file_title.textContent = file
	$file_content.value = `Loading ${file}`
	fetch(`file/${file}`)
		.then(response => response.text())
		.then((text)=>{
			$file_content.value = text
			$file_content.classList.remove('error')
		})
	.catch(err => alert(err));
}

function postFileContents(event) {
	const file = event.target.dataset.file
	if (!file) {
		alert('no file selected');
		return
	}
	console.log('save', file, $file_content.value)
	const body = {
		content: $file_content.value
	}
	if ($username.value) {
		body.username = $username.value
	}
	if ($message.value) {
		body.message = $message.value
	}
	fetch(`file/${file}`, {
		method: "POST",
		body: JSON.stringify(body)
	})
		.then(response => {
			if (response.status != 201) {
				alert('failed to save')
				return
			}
			console.debug('saved', response)
		})
	.catch(err => {
		alert(err)
	});
}
$button_save.addEventListener('click', postFileContents)

function selectFileContents(event) {
    if(!$button_save.dataset.file) {
        alert('no file selected');
        return
    }
    $input_upload.accept = $button_save.dataset.file.split('.').pop()
	$input_upload.click()
}
$button_upload.addEventListener('click', selectFileContents)

function uploadFileContents(event) {
    const file = event.target.files[0]
    if (!file) {
        alert('no file selected');
        return
    }
    const reader = new FileReader()
    reader.onload = (e) => {
        $file_content.value = e.target.result
    }
    reader.readAsText(file)
}
$input_upload.addEventListener('change', uploadFileContents)

function downloadFileContents(event) {
    if(!$button_save.dataset.file) {
        alert('no file selected');
        return
    }
    const file = $button_save.dataset.file
    const blob = new Blob([$file_content.value], {type: 'text/plain'})
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href = url
    a.download = file
    a.click()
    URL.revokeObjectURL(url)
}
$button_download.addEventListener('click', downloadFileContents)

function filenameToTrackId(text) {
    // Keep this in-sync with _filename_to_track_id in processmedia3
    text = text.split('/').pop().split('.').shift()
    text = text.replace(/\w+/g, function(txt) {
        return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
    })
    text = text.replace(/\s+\[.*?\]$/, '')
    text = text.replace(/[^a-zA-Z0-9_]+/g, '_')
    text = text.replace(/^_*|_*$/g, '');
    return text
}
console.assert(filenameToTrackId('Anime/H-n-K - My Song (Miku ver) [Instrumental].txt') === 'H_N_K_My_Song_Miku_Ver');

function renderFiles(data) {
    const track_id = new URLSearchParams(location.search).get('track_id')
    if(track_id) {
        data = data.filter(file => filenameToTrackId(file) === track_id)
    }
	$file_list.innerHTML = ''
	$file_list.appendChild(h('ul',{},data.map((file)=>{
		const $link = h('a',{'data-file':file,href:'javascript:void(0)'},file)
		$link.addEventListener('click', getFileContents)
		return h('li',{},$link)
	})))
}

fetch(`files.json`)
    .then(response => response.json())
    .then(renderFiles)
    .catch(err => alert(err))

$username.addEventListener('change', function() {
    localStorage.setItem('karakara_contributor_name', $username.value)
})
document.addEventListener('DOMContentLoaded', function() {
    const savedUsername = localStorage.getItem('karakara_contributor_name')
    if (savedUsername) {
        $username.value = savedUsername
    }
})

</script>
</body>
</html>
